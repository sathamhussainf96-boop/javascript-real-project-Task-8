<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Category Filter</title>
  <style>
    body {
      background-color: #f3f4f6;
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 40px 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    .filter-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 30px;
    }

    .filter-btn {
      background-color: #ffffff;
      border: 2px solid #e5e7eb;
      border-radius: 20px;
      padding: 8px 18px;
      font-size: 0.95rem;
      font-weight: 500;
      color: #4b5563;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter-btn:hover {
      border-color: #cbd5e1;
      color: #1f2937;
    }

    .filter-btn.active {
      background-color: #2563eb;
      border-color: #2563eb;
      color: #ffffff;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    .product-card {
      background: #ffffff;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .product-card.is-hovered {
      transform: translateY(-6px);
      box-shadow: 0 16px 24px rgba(0, 0, 0, 0.12);
    }

    .product-image {
      width: 100%;
      height: 160px;
      border-radius: 8px;
      margin-bottom: 16px;
      object-fit: cover;
    }

    .product-title {
      font-size: 1.1rem;
      color: #1f2937;
      margin: 0 0 8px 0;
    }

    .product-price {
      font-weight: bold;
      color: #2563eb;
      font-size: 1rem;
      margin: 0;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <div class="filter-group">
      <button class="filter-btn active" data-filter="all">All Products</button>
      <button class="filter-btn" data-filter="electronics">Electronics</button>
      <button class="filter-btn" data-filter="jewelery">Jewelery</button>
      <button class="filter-btn" data-filter="men's clothing">Men's Clothing</button>
      <button class="filter-btn" data-filter="women's clothing">Women's Clothing</button>
    </div>

    <div class="product-grid">
      
      <div class="product-card" data-category="men's clothing">
        <img src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=400&q=80" alt="Casual Shirt" class="product-image">
        <h3 class="product-title">Casual Linen Shirt</h3>
        <p class="product-price">$39.99</p>
      </div>

      <div class="product-card" data-category="electronics">
        <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400&q=80" alt="Wireless Headphones" class="product-image">
        <h3 class="product-title">Wireless Headphones</h3>
        <p class="product-price">$99.99</p>
      </div>

      <div class="product-card" data-category="jewelery">
        <img src="https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?w=400&q=80" alt="Silver Necklace" class="product-image">
        <h3 class="product-title">Silver Pendant Necklace</h3>
        <p class="product-price">$120.00</p>
      </div>

      <div class="product-card" data-category="women's clothing">
        <img src="https://images.unsplash.com/photo-1572804013309-59a88b7e92f1?w=400&q=80" alt="Summer Dress" class="product-image">
        <h3 class="product-title">Floral Summer Dress</h3>
        <p class="product-price">$54.99</p>
      </div>

      <div class="product-card" data-category="electronics">
        <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400&q=80" alt="Smart Watch" class="product-image">
        <h3 class="product-title">Minimalist Smart Watch</h3>
        <p class="product-price">$149.00</p>
      </div>

    </div>
  </div>

  <script>
    const buttons = document.querySelectorAll('.filter-btn');
    const cards = document.querySelectorAll('.product-card');

    buttons.forEach(button => {
      button.addEventListener('click', () => {
        
        buttons.forEach(btn => btn.classList.remove('active'));
        button.classList.add('active');

        const targetCategory = button.getAttribute('data-filter');

        cards.forEach(card => {
          const cardCategory = card.getAttribute('data-category');

          if (targetCategory === 'all' || targetCategory === cardCategory) {
            card.style.display = 'block'; 
          } else {
            card.style.display = 'none';  
          }
        });
      });
    });

    cards.forEach(card => {
      card.addEventListener('mouseenter', () => card.classList.add('is-hovered'));
      card.addEventListener('mouseleave', () => card.classList.remove('is-hovered'));
    });
  </script>

</body>
</html>
